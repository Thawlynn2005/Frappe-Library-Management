{% extends "templates/web.html" %}

{% block page_content %}
<h1>{{ title }}</h1>
<table class="table">
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Status</th>
    </tr>
    {% for a in articles %}
    <tr>
        <td>{{ a.article_name }}</td>
        <td>{{ a.author or "" }}</td>
        <td>{{ a.status }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
